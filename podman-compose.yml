version: "3.9"

networks:
  codecoroner_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  ollama_models:
    driver: local
  repo_cache:
    driver: local
  static_volume:
    driver: local
  nginx_certs:
    driver: local

x-logging: &default-logging
  driver: k8s-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: codecoroner-postgres
    logging: *default-logging
    mem_limit: 2g
    volumes:
      - pg_data:/var/lib/postgresql/data:Z
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z
    environment:
      POSTGRES_DB: ${DB_NAME:-codecoroner}
      POSTGRES_USER: ${DB_USER:-codecoroner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    networks:
      - codecoroner_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-codecoroner}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5432:5432"

  redis:
    image: docker.io/redis:7-alpine
    container_name: codecoroner-redis
    logging: *default-logging
    mem_limit: 1g
    volumes:
      - redis_data:/data:Z
    networks:
      - codecoroner_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${BIND_ADDR:-127.0.0.1}:6379:6379"

  minio:
    image: docker.io/minio/minio:latest
    container_name: codecoroner-minio
    logging: *default-logging
    mem_limit: 1g
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data:Z
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-codecoroner}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minio_dev_password}
    networks:
      - codecoroner_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9000:9000"
      - "${BIND_ADDR:-127.0.0.1}:9001:9001"

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: codecoroner-ollama
    logging: *default-logging
    mem_limit: ${OLLAMA_MEM_LIMIT:-8g}
    volumes:
      - ollama_models:/root/.ollama:Z
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 30m
    networks:
      - codecoroner_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    ports:
      - "${BIND_ADDR:-127.0.0.1}:11434:11434"

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codecoroner-django
    logging: *default-logging
    mem_limit: 2g
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app:Z
      - static_volume:/app/static:Z
      - repo_cache:/app/media/repos:Z
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      GIT_PYTHON_REFRESH: quiet
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codecoroner_net
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  daphne:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codecoroner-daphne
    logging: *default-logging
    mem_limit: 1g
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    volumes:
      - ./backend:/app:Z
      - repo_cache:/app/media/repos:Z
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      GIT_PYTHON_REFRESH: quiet
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - django
      - redis
    networks:
      - codecoroner_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8001:8001"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codecoroner-celery
    logging: *default-logging
    mem_limit: ${CELERY_MEM_LIMIT:-4g}
    command: celery -A config.celery worker -l INFO --concurrency=2 -Q celery,llm
    volumes:
      - ./backend:/app:Z
      - repo_cache:/app/media/repos:Z
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      GIT_PYTHON_REFRESH: quiet
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - django
      - redis
    networks:
      - codecoroner_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codecoroner-beat
    logging: *default-logging
    mem_limit: 1g
    command: celery -A config.celery beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app:Z
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - django
      - redis
    networks:
      - codecoroner_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; cmds=[open('/proc/'+p+'/cmdline','rb').read().decode(errors='ignore') for p in os.listdir('/proc') if p.isdigit()]; raise SystemExit(0 if any('celery' in c and 'beat' in c for c in cmds) else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codecoroner-frontend
    logging: *default-logging
    mem_limit: 512m
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
    networks:
      - codecoroner_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:80"

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: codecoroner-ai-engine
    logging: *default-logging
    mem_limit: 2g
    volumes:
      - ./ai-engine:/app:Z
      - repo_cache:/app/repos:ro,Z
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - codecoroner_net
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    image: docker.io/nginx:alpine
    container_name: codecoroner-nginx
    logging: *default-logging
    mem_limit: 512m
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf-src/nginx.conf:ro,Z
      - ./infra/nginx/nginx-behind-proxy.conf:/etc/nginx/conf-src/nginx-behind-proxy.conf:ro,Z
      - ./infra/nginx/entrypoint.sh:/entrypoint.sh:ro,Z
      - static_volume:/static:ro,Z
      - nginx_certs:/etc/nginx/certs
    environment:
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      CERT_MODE: ${CERT_MODE:-selfsigned}
    depends_on:
      - django
      - frontend
    networks:
      - codecoroner_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$CERT_MODE\" = behind-proxy ]; then wget -q -O /dev/null http://localhost/; else wget -q -O /dev/null --no-check-certificate https://localhost:443/; fi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
