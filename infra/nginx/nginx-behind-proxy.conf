# Plain-HTTP variant used when CERT_MODE=behind-proxy, i.e. TLS is terminated
# by the customer's own reverse proxy upstream. No redirect, no HSTS here:
# both must be configured on the outer proxy.
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 172.20.0.1 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        port_in_redirect off;

        client_max_body_size 100M;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;

        location /static/ {
            set $backend http://django:8000;
            proxy_pass $backend;
        }

        location /media/ {
            set $backend http://django:8000;
            proxy_pass $backend;
        }

        location /api/ {
            set $backend http://django:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        location /ws/ {
            set $backend http://daphne:8001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location / {
            set $backend http://frontend;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
